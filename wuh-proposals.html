<title>ระบบเสนอโครงการ WUH</title>
<style>
:root{
  --bg:#F6F4EF;
  --surface:#FFFFFF;
  --surface-alt:#EFEBE1;
  --border:#E0DACB;
  --ink:#26241E;
  --ink-muted:#726C5C;
  --accent:#5B3E78;
  --accent-ink:#FFFFFF;
  --accent-soft:#ECE3F3;
  --navy:#1F3A54;
  --navy-ink:#FFFFFF;
  --status-draft:#8A8577;
  --status-draft-soft:#EEECE6;
  --status-submitted:#2B6CB0;
  --status-submitted-soft:#E3EDF7;
  --status-approved:#2F7A4F;
  --status-approved-soft:#E3F1E8;
  --status-revision:#B7791F;
  --status-revision-soft:#F8EEDD;
  --danger:#B23B3B;
  --danger-soft:#F8E7E7;
  --cat-compensation:#4C6FCB;
  --cat-compensation-soft:#E7ECFB;
  --cat-operating:#2F9E77;
  --cat-operating-soft:#E1F3EC;
  --cat-materials:#8B5FBF;
  --cat-materials-soft:#EFE7F8;
  --cat-capital:#D98A2B;
  --cat-capital-soft:#FBEEDC;
  --shadow:0 1px 2px rgba(38,36,30,0.06),0 4px 14px rgba(38,36,30,0.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1815;
    --surface:#242119;
    --surface-alt:#2B2820;
    --border:#3D392C;
    --ink:#EEE9DD;
    --ink-muted:#A79F8B;
    --accent:#B593D6;
    --accent-ink:#1A1522;
    --accent-soft:#3A2F49;
    --navy:#7EA6C9;
    --navy-ink:#12202D;
    --status-draft:#A9A190;
    --status-draft-soft:#332F26;
    --status-submitted:#7BAEDE;
    --status-submitted-soft:#22303F;
    --status-approved:#7BC79A;
    --status-approved-soft:#1F3327;
    --status-revision:#E0AE5C;
    --status-revision-soft:#3A2E17;
    --danger:#E08787;
    --danger-soft:#3A2222;
    --cat-compensation:#8AA3E8;
    --cat-compensation-soft:#26304A;
    --cat-operating:#7BC9A8;
    --cat-operating-soft:#1E3A30;
    --cat-materials:#C3A3E0;
    --cat-materials-soft:#382C46;
    --cat-capital:#E8B368;
    --cat-capital-soft:#3E2F1B;
    --shadow:0 1px 2px rgba(0,0,0,0.3),0 4px 16px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"]{
  --bg:#1A1815;
  --surface:#242119;
  --surface-alt:#2B2820;
  --border:#3D392C;
  --ink:#EEE9DD;
  --ink-muted:#A79F8B;
  --accent:#B593D6;
  --accent-ink:#1A1522;
  --accent-soft:#3A2F49;
  --navy:#7EA6C9;
  --navy-ink:#12202D;
  --status-draft:#A9A190;
  --status-draft-soft:#332F26;
  --status-submitted:#7BAEDE;
  --status-submitted-soft:#22303F;
  --status-approved:#7BC79A;
  --status-approved-soft:#1F3327;
  --status-revision:#E0AE5C;
  --status-revision-soft:#3A2E17;
  --danger:#E08787;
  --danger-soft:#3A2222;
  --cat-compensation:#8AA3E8;
  --cat-compensation-soft:#26304A;
  --cat-operating:#7BC9A8;
  --cat-operating-soft:#1E3A30;
  --cat-materials:#C3A3E0;
  --cat-materials-soft:#382C46;
  --cat-capital:#E8B368;
  --cat-capital-soft:#3E2F1B;
  --shadow:0 1px 2px rgba(0,0,0,0.3),0 4px 16px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;
  font-size:16px;
  line-height:1.55;
}
h1,h2,h3,h4{text-wrap:balance;margin:0;}
button{font-family:inherit;}
.num{font-variant-numeric:tabular-nums;}
::selection{background:var(--accent-soft);}
a{color:var(--accent);}

/* app shell */
#topbar{
  background:var(--accent);
  color:var(--accent-ink);
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
}
#topbar .brand{display:flex;flex-direction:column;gap:2px;}
#topbar .brand .th{font-weight:700;font-size:19px;}
#topbar .brand .en{font-size:12.5px;opacity:.85;letter-spacing:.02em;}
#topbar .brand-mark{
  display:flex;align-items:center;gap:12px;
}
#topbar .brand-mark .badge-icon{
  width:38px;height:38px;border-radius:10px;
  background:rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex:none;
}
#topbar .actions{display:flex;gap:8px;align-items:center;}
#topbar button.ghost{
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.28);
  color:var(--accent-ink);
  padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;
}
#topbar button.ghost:hover{background:rgba(255,255,255,.24);}

/* tab bar */
#tabbar{
  display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:10px 20px;
}
#tabbar .tab{
  background:transparent;border:1px solid transparent;color:var(--ink-muted);
  padding:9px 14px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:7px;white-space:nowrap;
}
#tabbar .tab:hover{background:var(--surface-alt);color:var(--ink);}
#tabbar .tab.active{background:var(--accent-soft);color:var(--accent);}
#tabbar .tab .tab-icon{font-size:15px;}
#tabbar .tab .tab-count{
  background:var(--accent);color:var(--accent-ink);
  font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px;
}
#tabbar .tab:not(.active) .tab-count{background:var(--border);color:var(--ink-muted);}

main{max-width:1180px;margin:0 auto;padding:24px 20px 80px;}

.page-title{font-size:20px;font-weight:700;margin-bottom:4px;}
.page-sub{color:var(--ink-muted);font-size:13.5px;margin-bottom:20px;}
.panel{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow);
}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;}
.panel-title{font-size:15px;font-weight:700;margin:0 0 12px;}
.panel-head .panel-title{margin:0;}
.cat-stats .stat-tile{border-top:3px solid transparent;}
.cat-stats .stat-tile.cat-compensation{border-top-color:var(--cat-compensation);}
.cat-stats .stat-tile.cat-operating{border-top-color:var(--cat-operating);}
.cat-stats .stat-tile.cat-materials{border-top-color:var(--cat-materials);}
.cat-stats .stat-tile.cat-capital{border-top-color:var(--cat-capital);}
.chart-svg text{font-family:"Sarabun",system-ui,sans-serif;}
.recent-row{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;
}
.recent-row:last-child{border-bottom:none;}
.recent-row:hover .recent-name{color:var(--accent);}
.recent-row .recent-name{font-weight:600;font-size:14px;}
.recent-row .recent-meta{font-size:12px;color:var(--ink-muted);margin-top:2px;}
.recent-row .recent-right{text-align:right;flex:none;}

/* --------- list view --------- */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;
  margin-bottom:22px;
}
.stat-tile{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px 16px;
  box-shadow:var(--shadow);
}
.stat-tile .label{font-size:12.5px;color:var(--ink-muted);letter-spacing:.03em;}
.stat-tile .value{font-size:24px;font-weight:700;margin-top:4px;}
.stat-tile .value.small{font-size:19px;}

.toolbar{
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  margin-bottom:16px;
}
.toolbar input[type=search],.toolbar select{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--ink);
  border-radius:8px;
  padding:9px 12px;
  font-size:14px;
  font-family:inherit;
}
.toolbar input[type=search]{flex:1 1 220px;min-width:180px;}
.spacer{flex:1;}
.btn-primary{
  background:var(--accent);color:var(--accent-ink);border:none;
  padding:10px 18px;border-radius:8px;font-weight:700;font-size:14.5px;cursor:pointer;
}
.btn-primary:hover{filter:brightness(1.08);}
.btn-secondary{
  background:var(--surface);color:var(--ink);border:1px solid var(--border);
  padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;
}
.btn-secondary:hover{background:var(--surface-alt);}
.btn-danger{
  background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger);
  padding:9px 16px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;
}

#cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:14px;
}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
  box-shadow:var(--shadow);
  cursor:pointer;
  display:flex;flex-direction:column;gap:10px;
}
.card:hover{border-color:var(--accent);}
.card .top-row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
.card .name{font-weight:700;font-size:16.5px;line-height:1.35;}
.card .dept{font-size:13px;color:var(--ink-muted);}
.badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap;
}
.badge.status-draft{background:var(--status-draft-soft);color:var(--status-draft);}
.badge.status-submitted{background:var(--status-submitted-soft);color:var(--status-submitted);}
.badge.status-approved{background:var(--status-approved-soft);color:var(--status-approved);}
.badge.status-revision{background:var(--status-revision-soft);color:var(--status-revision);}
.badge.type-operational{background:var(--surface-alt);color:var(--ink-muted);}
.badge.type-new1y{background:var(--accent-soft);color:var(--accent);}
.badge.type-newspecial{background:var(--status-submitted-soft);color:var(--status-submitted);}
.badge.example{background:var(--status-revision-soft);color:var(--status-revision);}
.card .bottom-row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;}
.card .budget-label{font-size:11.5px;color:var(--ink-muted);}
.card .budget-value{font-size:17px;font-weight:700;}
.card .updated{font-size:12px;color:var(--ink-muted);}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;}
.empty-state{
  border:1px dashed var(--border);border-radius:12px;padding:40px 20px;text-align:center;
  color:var(--ink-muted);
}

/* --------- detail view --------- */
#view-detail{display:none;}
.detail-head{
  display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;
  margin-bottom:18px;
}
.detail-head h2{font-size:21px;}
.detail-head .sub{color:var(--ink-muted);font-size:13.5px;margin-top:3px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.field-row.three{grid-template-columns:1fr 1fr 1fr;}
.field-row.five{grid-template-columns:repeat(5,1fr);}
@media (max-width:720px){
  .field-row,.field-row.three,.field-row.five{grid-template-columns:1fr;}
}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.field label{font-size:13px;font-weight:600;color:var(--ink-muted);}
.field .hint{font-size:11.5px;color:var(--ink-muted);font-weight:400;}
input[type=text],input[type=number],input[type=date],textarea,select{
  width:100%;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--ink);
  border-radius:8px;
  padding:9px 11px;
  font-size:14.5px;
  font-family:inherit;
}
textarea{resize:vertical;min-height:64px;line-height:1.5;}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}

.section-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  box-shadow:var(--shadow);
  margin-bottom:16px;
  overflow:hidden;
}
.section-head{
  background:var(--navy);color:var(--navy-ink);
  padding:13px 18px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;
  user-select:none;
}
.section-head .titles{display:flex;flex-direction:column;gap:1px;}
.section-head .th-title{font-weight:700;font-size:15.5px;}
.section-head .en-title{font-size:11.5px;opacity:.8;}
.section-head .chev{transition:transform .15s ease;font-size:13px;}
.section-card.collapsed .chev{transform:rotate(-90deg);}
.section-body{padding:18px 20px;}
.section-card.collapsed .section-body{display:none;}
.note-red{color:var(--danger);font-weight:700;font-size:13px;}
.type-options{display:flex;flex-direction:column;gap:10px;}
.type-option{display:flex;align-items:flex-start;gap:9px;font-size:14px;}
.type-option input{width:auto;margin-top:3px;flex:none;}
.type-option .type-hint{display:block;color:var(--danger);font-size:12px;font-weight:600;margin-top:1px;}
.pdca-flag{
  display:inline-block;background:var(--status-revision-soft);color:var(--status-revision);
  font-weight:700;padding:3px 10px;border-radius:6px;font-size:12.5px;margin-bottom:10px;
}

table.grid-table{width:100%;border-collapse:collapse;font-size:13.5px;}
table.grid-table th{
  background:var(--surface-alt);color:var(--ink-muted);
  text-align:left;font-size:12px;font-weight:700;letter-spacing:.02em;
  padding:8px 8px;border-bottom:1px solid var(--border);white-space:nowrap;
}
table.grid-table td{padding:6px 6px;border-bottom:1px solid var(--border);vertical-align:top;}
table.grid-table tr:nth-child(even) td{background:var(--surface-alt);}
table.grid-table input,table.grid-table textarea,table.grid-table select{font-size:13.5px;padding:6px 8px;}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;}
.row-actions{display:flex;justify-content:flex-end;margin-top:8px;}
.icon-btn{
  background:none;border:1px solid var(--border);border-radius:6px;
  color:var(--ink-muted);width:28px;height:28px;cursor:pointer;font-size:15px;line-height:1;
}
.icon-btn:hover{color:var(--danger);border-color:var(--danger);}
.add-row-btn{
  background:var(--accent-soft);color:var(--accent);border:1px solid transparent;
  padding:7px 14px;border-radius:7px;font-size:13.5px;font-weight:700;cursor:pointer;
}
.checklist{display:flex;flex-direction:column;gap:6px;}
.checklist .group-title{font-weight:700;font-size:14px;margin:10px 0 4px;color:var(--ink);}
.check-item{display:flex;align-items:flex-start;gap:9px;font-size:14px;padding:4px 0;}
.check-item input{width:auto;margin-top:3px;flex:none;}
.check-item .id{font-weight:700;color:var(--accent);margin-right:4px;}
.summary-line{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--surface-alt);border-radius:8px;padding:10px 14px;margin-top:10px;
  font-size:14.5px;gap:12px;flex-wrap:wrap;
}
.summary-line .amount{font-weight:700;font-size:18px;}
.summary-line .words{color:var(--ink-muted);font-size:13px;}

.savebar{
  position:sticky;bottom:0;background:var(--surface);
  border-top:1px solid var(--border);
  padding:12px 20px;margin:0 -20px;
  display:flex;gap:10px;justify-content:flex-end;align-items:center;
  box-shadow:0 -4px 14px rgba(0,0,0,.05);
}
.savebar .save-hint{margin-right:auto;font-size:12.5px;color:var(--ink-muted);}

.section-nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;}
.section-nav button{
  background:var(--surface);border:1px solid var(--border);color:var(--ink-muted);
  font-size:12px;padding:5px 10px;border-radius:99px;cursor:pointer;font-weight:600;
}
.section-nav button:hover{border-color:var(--accent);color:var(--accent);}

.modal-overlay{
  position:fixed;inset:0;background:rgba(20,18,14,.45);
  display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
}
.modal{
  background:var(--surface);border-radius:12px;padding:22px;max-width:380px;width:100%;
  box-shadow:0 10px 40px rgba(0,0,0,.25);
}
.modal h3{font-size:16.5px;margin-bottom:8px;}
.modal p{font-size:14px;color:var(--ink-muted);margin:0 0 18px;}
.modal .row{display:flex;gap:10px;justify-content:flex-end;}
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;
  font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:60;
  opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
.offline-note{
  background:var(--status-revision-soft);color:var(--status-revision);
  border:1px solid var(--status-revision);border-radius:8px;padding:9px 14px;
  font-size:13px;margin-bottom:16px;
}
@media print{
  #topbar,#tabbar,.toolbar,.savebar,.section-nav,.icon-btn,.add-row-btn,#view-dashboard,#view-registry,#view-budget,#view-strategy{display:none !important;}
  body{background:#fff;color:#000;}
  .section-card{box-shadow:none;border:1px solid #999;break-inside:avoid;}
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>

<div id="topbar">
  <div class="brand-mark">
    <div class="badge-icon">🏥</div>
    <div class="brand">
      <div class="th">ระบบเสนอโครงการและขออนุมัติงบประมาณ</div>
      <div class="en">Walailak University Hospital · Project &amp; Budget Proposals</div>
    </div>
  </div>
  <div class="actions" id="topbar-actions"></div>
</div>

<nav id="tabbar">
  <button class="tab" data-tab="dashboard"><span class="tab-icon">📊</span><span>ภาพรวมแผนงาน</span></button>
  <button class="tab" data-tab="registry"><span class="tab-icon">📁</span><span>ทะเบียนข้อเสนอโครงการ</span><span class="tab-count" id="tab-count">0</span></button>
  <button class="tab" data-tab="budget"><span class="tab-icon">📈</span><span>วิเคราะห์จำแนกงบประมาณ</span></button>
  <button class="tab" data-tab="strategy"><span class="tab-icon">🎯</span><span>สอดคล้องยุทธศาสตร์</span></button>
</nav>

<main>
  <div id="offline-note" class="offline-note" style="display:none;">
    หน้านี้กำลังแสดงข้อมูลตัวอย่างในเครื่องเท่านั้น การแก้ไขจะไม่ถูกบันทึกแบบเรียลไทม์ — เปิดผ่านลิงก์ที่เผยแพร่บน claude.ai เพื่อบันทึกและแชร์ข้อมูลกับทีม
  </div>

  <section id="view-dashboard"></section>

  <section id="view-registry" style="display:none;">
    <div class="toolbar">
      <input type="search" id="search-input" placeholder="ค้นหาชื่อโครงการ / หน่วยงาน…">
      <select id="filter-status">
        <option value="">สถานะทั้งหมด</option>
        <option value="draft">ร่างโครงการ</option>
        <option value="submitted">เสนอขออนุมัติ</option>
        <option value="approved">อนุมัติแล้ว</option>
        <option value="revision">ให้ปรับปรุง</option>
      </select>
      <select id="filter-type">
        <option value="">ประเภททั้งหมด</option>
        <option value="operational">งาน/กิจกรรม/โครงการประจำ</option>
        <option value="new1y">โครงการใหม่ ระยะเวลา 1 ปี</option>
        <option value="newspecial">โครงการใหม่/พิเศษ ระยะเวลาเกิน 1 ปี</option>
      </select>
      <div class="spacer"></div>
      <button class="btn-secondary" id="btn-download-template">⇩ เทมเพลตนำเข้า</button>

/* ---- Thai baht text ---- */
var TH_DIGIT=["","หนึ่ง","สอง","สาม","สี่","ห้า","หก","เจ็ด","แปด","เก้า"];
var TH_PLACE=["","สิบ","ร้อย","พัน","หมื่น","แสน"];
function thaiChunk(chunk){
  chunk = chunk.replace(/^0+/,"");
  if(chunk==="") return "";
  var len=chunk.length, out="";
  for(var i=0;i<len;i++){
    var d=parseInt(chunk[i],10), place=len-i-1;
    if(d===0) continue;
    if(place===0){ out += (d===1 && len>1) ? "เอ็ด" : TH_DIGIT[d]; }
    else if(place===1){ out += (d===1) ? "สิบ" : (d===2 ? "ยี่สิบ" : TH_DIGIT[d]+"สิบ"); }
    else { out += TH_DIGIT[d]+TH_PLACE[place]; }
  }
  return out;
}
function thaiInt(numStr){
  numStr = String(numStr).replace(/^0+/,"") || "0";
  if(numStr==="0") return "ศูนย์";
  var groups=[], s=numStr;
  while(s.length>0){ groups.unshift(s.slice(-6)); s=s.slice(0,-6); }
  var parts=[];
  for(var g=0; g<groups.length; g++){
    if(parseInt(groups[g],10)===0) continue;
    var suffixCount = groups.length-1-g;
    parts.push(thaiChunk(groups[g]) + "ล้าน".repeat(suffixCount));
  }
  return parts.join("");
}
function thaiBahtText(amount){
  amount = Math.max(0, Number(amount)||0);
  var fixed = amount.toFixed(2);
  var bits = fixed.split(".");
  var intPart = bits[0], satang = parseInt(bits[1],10);
  var text = thaiInt(intPart) + "บาท";
  text += satang===0 ? "ถ้วน" : (thaiChunk(String(satang)) + "สตางค์");
  return text;
}
function fmtMoney(n){ return (Number(n)||0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtInt(n){ return (Number(n)||0).toLocaleString("th-TH"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function timeAgo(iso){
  if(!iso) return "-";
  var diff = Date.now() - new Date(iso).getTime();
  var m = Math.floor(diff/60000);
  if(m<1) return "เมื่อสักครู่";
  if(m<60) return m+" นาทีที่แล้ว";
  var h=Math.floor(m/60); if(h<24) return h+" ชั่วโมงที่แล้ว";
  var d=Math.floor(h/24); if(d<30) return d+" วันที่แล้ว";
  return new Date(iso).toLocaleDateString("th-TH");
}
function budgetTotal(p){ return (p.budgetItems||[]).reduce(function(s,it){ return s+(Number(it.amount)||0); },0); }

function b64ToArrayBuffer(b64){
  var bin = atob(b64);
  var len = bin.length;
  var bytes = new Uint8Array(len);
  for(var i=0;i<len;i++) bytes[i]=bin.charCodeAt(i);
  return bytes.buffer;
}

  var cell = ws.getCell(ref);
  cell.value = text==null ? "" : String(text);
  cell.alignment = Object.assign({wrapText:true, vertical:"top", horizontal:"left"}, align||{});
}
function xlNum(ws, ref, value, numFmt){
  var cell = ws.getCell(ref);
  cell.value = Number(value)||0;
  cell.numFmt = numFmt || "#,##0.00";
  cell.alignment = {vertical:"middle", horizontal:"right"};
}
function xlMarkChecklist(ws, ref, fallback){
  var cell = ws.getCell(ref);
  var cur = cell.value ? String(cell.value) : fallback;
  cell.value = cur.replace(/^\s*o\s*/, "☑ ");
  cell.alignment = {wrapText:true, vertical:"top", horizontal:"left"};
}
function fitRow(ws, rowNum, text, charsPerLine, minHeight){
  var t = String(text||"");
  if(!t) return;
  var explicitLines = t.split("\n").length;
  var wrapLines = Math.ceil(t.length / Math.max(8, charsPerLine));
  var lines = Math.max(explicitLines, wrapLines, 1);
  var h = Math.max(minHeight||18, lines*16+8);
  var row = ws.getRow(rowNum);
  if(!row.height || row.height < h) row.height = h;
}
function fitMergeLastRow(ws, lastRowNum, text, charsPerLine){
  var t = String(text||"");
  if(!t) return;
  var explicitLines = t.split("\n").length;
  var wrapLines = Math.ceil(t.length / Math.max(8, charsPerLine));
  var lines = Math.max(explicitLines, wrapLines, 1);
  var extra = Math.max(0, (lines-1)*16);
  if(extra>0){
    var row = ws.getRow(lastRowNum);
    row.height = Math.max(row.height||18, 18+extra);
  }
}

function labelToKey(meta, label, fallback){
  if(label==null) return fallback;
  var s=String(label).trim();
  if(!s) return fallback;
  var found=Object.keys(meta).find(function(k){ return meta[k].label===s; });
  return found||fallback;
}
function unitLabelToKey(label, fallback){
  if(label==null) return fallback;
  var s=String(label).trim();
  if(!s) return fallback;
  var found=Object.keys(TARGET_UNIT_LABEL).find(function(k){ return TARGET_UNIT_LABEL[k]===s; });
  return found||fallback;
}
function cellText(v){
  if(v==null) return "";
  if(typeof v==="object"){
    if(v.text!=null) return String(v.text);
    if(v.richText) return v.richText.map(function(r){ return r.text; }).join("");
    if(v.result!=null) return String(v.result);
  }
  return String(v);
}

async function handleImportFile(file){
  if(!file) return;
  if(typeof ExcelJS === "undefined"){ toast("ไม่สามารถโหลดตัวอ่านไฟล์ Excel ได้"); return; }
  var buf;
  try{ buf = await file.arrayBuffer(); }
  catch(e){ toast("อ่านไฟล์ไม่สำเร็จ"); return; }
  var wb = new ExcelJS.Workbook();
  try{ await wb.xlsx.load(buf); }
  catch(e){ toast("ไฟล์ไม่ถูกต้องหรือเสียหาย: "+(e&&e.message?e.message:"")); return; }
  var ws = wb.worksheets[0];
  if(!ws){ toast("ไม่พบชีตข้อมูลในไฟล์"); return; }

  var nameCol = IMPORT_COLUMNS.findIndex(function(c){ return c.key==="name"; })+1;
  var results=[], skipped=0;
  var lastRow = ws.actualRowCount || ws.rowCount || 0;
  for(var r=5; r<=lastRow; r++){
    var row = ws.getRow(r);
    var name = cellText(row.getCell(nameCol).value).trim();
    if(!name){
      var hasAny = IMPORT_COLUMNS.some(function(c,i){ return cellText(row.getCell(i+1).value).trim()!==""; });
      if(hasAny) skipped++;
      continue;
    }
    var p = emptyProposal();
    p.name = name;
    IMPORT_COLUMNS.forEach(function(c,i){
      if(c.key==="name") return;
      var s = cellText(row.getCell(i+1).value);
      switch(c.key){
        case "type": p.type = labelToKey(TYPE_META, s, p.type); break;
        case "status": p.status = labelToKey(STATUS_META, s, p.status); break;
        case "targetUnit": p.targetUnit = unitLabelToKey(s, p.targetUnit); break;
        case "targetQty": p.targetQty = s; break;
        case "totalBudget":
          var amt=Number(s)||0;
          if(amt>0) p.budgetItems=[{item:"งบประมาณรวม (นำเข้าจากเทมเพลต)", amount:amt, category:"operating"}];
          break;
        case "sigName": p.signatory.name = s; break;
        case "sigPosition": p.signatory.position = s; break;
        case "sigDate": p.signatory.date = s; break;
        default: if(Object.prototype.hasOwnProperty.call(p,c.key)) p[c.key] = s;
      }
    });
    results.push(p);
  }

  if(results.length===0){
    toast(skipped>0 ? "ไม่พบโครงการที่มีชื่อ (ข้าม "+skipped+" แถวที่ไม่มีชื่อโครงการ)" : "ไม่พบข้อมูลในไฟล์ที่จะนำเข้า");
    return;
  }
  showModal("นำเข้าโครงการ",
    "พบข้อมูล "+results.length+" โครงการในไฟล์"+(skipped>0?" (ข้าม "+skipped+" แถวที่ไม่มีชื่อโครงการ)":"")+" ต้องการนำเข้าทั้งหมดหรือไม่?",
    function(){ commitImportedProposals(results); },
    "นำเข้า "+results.length+" โครงการ", false);
}

function commitImportedProposals(list){
  var now=new Date().toISOString();
  if(db){
    var writes = list.map(function(p){
      p.createdAt=now; p.updatedAt=now; p.isExample=false;
      var ref = db.collection("proposals").doc();
      p.id = ref.id;
      return ref.set(JSON.parse(JSON.stringify(p)));
    });
    Promise.all(writes).then(function(){
      toast("นำเข้าโครงการเรียบร้อย "+list.length+" รายการ");
      switchTab("registry");
    }).catch(function(err){
      toast("นำเข้าไม่สำเร็จบางส่วน: "+(err&&err.message?err.message:"unknown"));
    });
  } else {
    list.forEach(function(p){
      p.id=uid(); p.createdAt=now; p.updatedAt=now; p.isExample=false;
      proposals.push(p);
    });
    saveLocal(proposals);
    toast("นำเข้าโครงการเรียบร้อย "+list.length+" รายการ (โหมดออฟไลน์)");
    switchTab("registry");
  }
}

function renderShell(){
  TABS.forEach(function(t){

  });
  document.getElementById("view-detail").style.display = (view==="detail") ? "block" : "none";
  document.getElementById("tabbar").style.display = (view==="detail") ? "none" : "flex";
  document.getElementById("tab-count").textContent = fmtInt(proposals.length);
  Array.prototype.forEach.call(document.querySelectorAll("#tabbar .tab"), function(btn){
    btn.classList.toggle("active", btn.getAttribute("data-tab")===view);
  });
  renderTopbarActions();
  if(view==="dashboard") renderDashboard();
  else if(view==="registry") renderRegistry();
  else if(view==="budget") renderBudgetAnalysis();
  else if(view==="strategy") renderStrategyAnalysis();
}

function switchTab(tab){
  view=tab; current=null;

}

function goDetail(proposal){
  view="detail"; current=proposal;
  renderShell();
  renderDetail();
}

function backFromDetail(){
  view="registry"; current=null;
  renderShell();
}

/* ---- chart helper (inline SVG, theme-aware via CSS vars) ---- */
function niceCeil(v){
  if(v<=0) return 1;
  var exp=Math.floor(Math.log10(v));
  var base=Math.pow(10,exp);
  var f=v/base;
  var niceF = f<=1?1:(f<=2?2:(f<=5?5:10));
  return niceF*base;
}
function renderBarChart(container, data, opts){
  opts=opts||{};
  var w=opts.width||640, h=opts.height||260;
  var padL=64,padR=16,padT=14,padB=40;
  var innerW=w-padL-padR, innerH=h-padT-padB;
  var maxVal=Math.max.apply(null, data.map(function(d){ return d.value; }).concat([0]));
  var rawStep=(maxVal||1)/5;
  var step=niceCeil(rawStep);
  if(opts.integer) step=Math.max(1, Math.ceil(step));
  var tickCount=Math.max(1, Math.ceil((maxVal||1)/step));
  var niceMax=step*tickCount;
  var n=data.length||1;
  var slot=innerW/n;
  var barW=Math.max(18, slot*0.55);
  var svg='<svg class="chart-svg" viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block;">';
  for(var i=0;i<=tickCount;i++){
    var val=step*i;
    var y=padT+innerH-(innerH*(val/niceMax));
    svg+='<line x1="'+padL+'" y1="'+y+'" x2="'+(w-padR)+'" y2="'+y+'" stroke="var(--border)" stroke-width="1"/>';
    svg+='<text x="'+(padL-10)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--ink-muted)">'+fmtInt(Math.round(val))+'</text>';
  }
  data.forEach(function(d,i){
    var bx=padL+i*slot+(slot-barW)/2;
    var bh=maxVal<=0?0:innerH*((d.value||0)/niceMax);
    var by=padT+innerH-bh;
    svg+='<rect x="'+bx.toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+Math.max(0,bh).toFixed(1)+'" rx="4" fill="'+d.color+'"/>';
    svg+='<text x="'+(bx+barW/2).toFixed(1)+'" y="'+(h-padB+18)+'" text-anchor="middle" font-size="12" fill="var(--ink-muted)">'+esc(d.label)+'</text>';
    if(opts.showValue){
      svg+='<text x="'+(bx+barW/2).toFixed(1)+'" y="'+(by-6).toFixed(1)+'" text-anchor="middle" font-size="11" fill="var(--ink)" font-weight="700">'+fmtInt(d.value)+'</text>';
    }
  });
  svg+='</svg>';
  container.innerHTML = svg;
}

/* ---- strategic alignment analysis ---- */
function renderStrategyAnalysis(){
  var el=document.getElementById("view-strategy");
  var hospCounts={}; STRATEGIES.hospital.forEach(function(h){ hospCounts[h.id]=0; });
  var uniCounts={}; STRATEGIES.university.forEach(function(s){ uniCounts[s.code]=0; });
  proposals.forEach(function(p){
    ((p.strategies&&p.strategies.hospital)||[]).forEach(function(id){ if(hospCounts.hasOwnProperty(id)) hospCounts[id]++; });
    var uni=(p.strategies&&p.strategies.university)||{};
    Object.keys(uni).forEach(function(code){
      var entry=uni[code];
      var hasTag = entry && (((entry.kpis||[]).length)||((entry.measures||[]).length));
      if(hasTag && uniCounts.hasOwnProperty(code)) uniCounts[code]++;
    });
  });

  el.innerHTML =
    '<div class="page-title">ความสอดคล้องกับยุทธศาสตร์</div>'+
    '<div class="page-sub">จำนวนโครงการที่เชื่อมโยงกับแต่ละยุทธศาสตร์ จากโครงการทั้งหมด '+fmtInt(proposals.length)+' โครงการ</div>'+
    '<div class="panel"><h3 class="panel-title">ยุทธศาสตร์ระดับโรงพยาบาล (Hospital-level)</h3><div id="strategy-hosp-chart"></div></div>'+
    '<div class="panel"><h3 class="panel-title">ยุทธศาสตร์ระดับมหาวิทยาลัย (University-level)</h3><div class="stats">'+
      STRATEGIES.university.map(function(s){
        return '<div class="stat-tile"><div class="label">'+esc(s.code)+'</div><div class="value num">'+fmtInt(uniCounts[s.code]||0)+' โครงการ</div></div>';
      }).join("")+
    '</div></div>';

  var palette=CATEGORY_ORDER.map(function(k){ return "var(--"+CATEGORY_META[k].cls+")"; });
  renderBarChart(document.getElementById("strategy-hosp-chart"), STRATEGIES.hospital.map(function(h,i){
    return {label:h.id, value:hospCounts[h.id]||0, color:palette[i%palette.length]};
  }), {showValue:true, integer:true});
}

    {num:11,th:"ผู้เสนอโครงการ",en:"Proposer sign-off",render:renderSignatorySection}

function renderStrategySection(el,p){
  var html='<div class="checklist">';
  STRATEGIES.university.forEach(function(strat){
    html += '<div class="group-title">'+esc(strat.code)+': '+esc(strat.title)+'</div>';
    strat.kpis.forEach(function(k){
      var checked = !!(p.strategies.university[strat.code] && (p.strategies.university[strat.code].kpis||[]).indexOf(k.id)>-1);
      html += '<label class="check-item"><input type="checkbox" data-uni="'+esc(strat.code)+'" data-kind="kpis" data-id="'+esc(k.id)+'" '+(checked?"checked":"")+'><span><span class="id">'+esc(k.id)+'</span>'+esc(k.label)+'</span></label>';
    });
    strat.measures.forEach(function(m){
      var checked = !!(p.strategies.university[strat.code] && (p.strategies.university[strat.code].measures||[]).indexOf(m.id)>-1);
      html += '<label class="check-item"><input type="checkbox" data-uni="'+esc(strat.code)+'" data-kind="measures" data-id="'+esc(m.id)+'" '+(checked?"checked":"")+'><span><span class="id">'+esc(m.id)+'</span>'+esc(m.label)+'</span></label>';
    });
  });
  html += '<div class="group-title">ยุทธศาสตร์ระดับโรงพยาบาล (Hospital-level)</div>';
  STRATEGIES.hospital.forEach(function(h){
    var checked = (p.strategies.hospital||[]).indexOf(h.id)>-1;
    html += '<label class="check-item"><input type="checkbox" data-hosp="'+esc(h.id)+'" '+(checked?"checked":"")+'><span><span class="id">'+esc(h.id)+'</span>'+esc(h.label)+'</span></label>';
  });
  html += '</div>';
  el.innerHTML = html;
  Array.prototype.forEach.call(el.querySelectorAll("input[data-uni]"), function(cb){
    cb.onchange=function(){
      var code=cb.getAttribute("data-uni"), kind=cb.getAttribute("data-kind"), id=cb.getAttribute("data-id");
      if(!p.strategies.university[code]) p.strategies.university[code]={kpis:[],measures:[]};
      var arr=p.strategies.university[code][kind]||(p.strategies.university[code][kind]=[]);
      var idx=arr.indexOf(id);
      if(cb.checked && idx===-1) arr.push(id);
      if(!cb.checked && idx>-1) arr.splice(idx,1);
    };
  });
  Array.prototype.forEach.call(el.querySelectorAll("input[data-hosp]"), function(cb){
    cb.onchange=function(){
      var id=cb.getAttribute("data-hosp");
      var arr=p.strategies.hospital||(p.strategies.hospital=[]);
      var idx=arr.indexOf(id);
      if(cb.checked && idx===-1) arr.push(id);
      if(!cb.checked && idx>-1) arr.splice(idx,1);
    };
  });
}

  document.getElementById("add-budget").onclick=function(){
    p.budgetItems.push({item:"",amount:0,category:"operating"});
    draw();
  };
}

function renderScenarioSection(el,p){
  var cols=["worst","likely","best"];
  var colLabels={worst:"Worst-Case (แย่ที่สุด)",likely:"Most Likely (เป็นไปได้ที่สุด)",best:"Best-Case (ดีที่สุด)"};
  var html='<div class="table-wrap"><table class="grid-table"><thead><tr><th>ตัวแปรหลัก</th>'+
    cols.map(function(c){ return '<th>'+colLabels[c]+'</th>'; }).join("")+'</tr></thead><tbody>';
  SCENARIO_ROWS.forEach(function(row){
    html+='<tr><td>'+esc(row.label)+'</td>';
    cols.forEach(function(c){
      var val=(p.scenario[c] && p.scenario[c][row.key]!=null)?p.scenario[c][row.key]:"";
      var type = row.type==="text"?"text":"number";
      html+='<td><input type="'+type+'" data-scn-col="'+c+'" data-scn-key="'+row.key+'" value="'+esc(val)+'"></td>';
    });
    html+='</tr>';
  });
  html+='</tbody></table></div>';
  el.innerHTML=html;
  Array.prototype.forEach.call(el.querySelectorAll("input[data-scn-col]"), function(inp){
    inp.oninput=function(){
      var c=inp.getAttribute("data-scn-col"), k=inp.getAttribute("data-scn-key");
      if(!p.scenario[c]) p.scenario[c]={};
      p.scenario[c][k]= inp.type==="number" ? (parseFloat(inp.value)||0) : inp.value;
    };
  });
}

function renderRiskSection(el,p){
  var html='<div class="table-wrap"><table class="grid-table"><thead><tr>'+
    '<th style="width:16%">ด้านความเสี่ยง</th><th>เหตุการณ์ความเสี่ยง</th><th>ผลกระทบ</th><th style="width:100px">โอกาสที่เกิด</th><th>มาตรการ/แนวทางป้องกัน</th></tr></thead><tbody>';
  p.risks.forEach(function(r,i){
    html+='<tr><td style="font-weight:600;">'+esc(r.category)+'</td>'+
      '<td><input type="text" data-risk="'+i+'" data-key="event" value="'+esc(r.event)+'"></td>'+
      '<td><input type="text" data-risk="'+i+'" data-key="impact" value="'+esc(r.impact)+'"></td>'+
      '<td><select data-risk="'+i+'" data-key="likelihood">'+
        ["ต่ำ","กลาง","สูง"].map(function(o){ return '<option value="'+o+'"'+(r.likelihood===o?" selected":"")+'>'+o+'</option>'; }).join("")+
      '</select></td>'+
      '<td><input type="text" data-risk="'+i+'" data-key="mitigation" value="'+esc(r.mitigation)+'"></td></tr>';
  });
  html+='</tbody></table></div>';
  el.innerHTML=html;
  Array.prototype.forEach.call(el.querySelectorAll("[data-risk]"), function(inp){
    inp.oninput=inp.onchange=function(){
      var i=parseInt(inp.getAttribute("data-risk"),10), k=inp.getAttribute("data-key");
      p.risks[i][k]=inp.value;
    };
  });
}

function renderActionSection(el,p){
  el.innerHTML =
    '<span class="pdca-flag">PDCA · Plan – Do – Check – Act</span>'+
    '<div class="table-wrap"><table class="grid-table"><thead><tr>'+
      '<th>ขั้นตอนกิจกรรม</th><th style="width:14%">ระยะเวลา</th><th style="width:16%">ตัวชี้วัด (KPI)</th><th style="width:12%">งบประมาณ</th><th style="width:10%">เชื่อมโยง</th><th style="width:14%">ผู้รับผิดชอบ</th><th style="width:36px"></th>'+
    '</tr></thead><tbody id="action-body"></tbody></table></div>'+
    '<div class="row-actions"><button class="add-row-btn" id="add-action">+ เพิ่มกิจกรรม</button></div>';
  var cols=[{key:"activity",type:"text"},{key:"timeline",type:"text"},{key:"kpi",type:"text"},{key:"budget",type:"text"},{key:"link",type:"text"},{key:"responsible",type:"text"}];
  renderArrayTable("action-body",p.actionPlan,cols);
  document.getElementById("add-action").onclick=function(){

    renderArrayTable("action-body",p.actionPlan,cols);

function renderSignatorySection(el,p){
  el.innerHTML =
    '<div class="field-row three">'+
      fieldHTML("s-name","ชื่อ-สกุล","",'<input type="text" id="s-name" value="'+esc(p.signatory.name)+'">')+
      fieldHTML("s-position","ตำแหน่ง","",'<input type="text" id="s-position" value="'+esc(p.signatory.position)+'">')+
      fieldHTML("s-date","วันที่เสนอ","",'<input type="date" id="s-date" value="'+esc(p.signatory.date)+'">')+
    '</div>';
  bindText("s-name",p.signatory,"name"); bindText("s-position",p.signatory,"position");
  document.getElementById("s-date").onchange=function(e){ p.signatory.date=e.target.value; };
}

/* ---- generic bindings ---- */
function bindText(id,obj,key){
  var el=document.getElementById(id);
  el.oninput=function(){ obj[key]=el.value; };
}
function bindNum(id,obj,key){
  var el=document.getElementById(id);
  el.oninput=function(){ obj[key]=parseFloat(el.value)||0; };
}
function renderArrayTable(tbodyId, arr, cols, onChange){
  var tbody=document.getElementById(tbodyId);
  tbody.innerHTML = arr.map(function(row,i){
    return '<tr>'+cols.map(function(c){
      var v=row[c.key]==null?"":row[c.key];
      if(c.type==="select"){
        var opts=(c.options||[]).map(function(o){
          return '<option value="'+esc(o.value)+'"'+(String(v)===String(o.value)?" selected":"")+'>'+esc(o.label)+'</option>';
        }).join("");
        return '<td><select data-row="'+i+'" data-key="'+c.key+'">'+opts+'</select></td>';
      }
      return '<td><input type="'+(c.type==="number"?"number":"text")+'" data-row="'+i+'" data-key="'+c.key+'" value="'+esc(v)+'"></td>';
    }).join("")+'<td><button class="icon-btn" data-remove="'+i+'" title="ลบแถว">✕</button></td></tr>';
  }).join("");
  Array.prototype.forEach.call(tbody.querySelectorAll("input,select"), function(inp){
    var handler=function(){
      var i=parseInt(inp.getAttribute("data-row"),10), k=inp.getAttribute("data-key");
      var col=cols.find(function(c){ return c.key===k; });
      arr[i][k] = col.type==="number" ? (parseFloat(inp.value)||0) : inp.value;
      if(onChange) onChange();
    };
    inp.oninput=handler;
    inp.onchange=handler;
  });
  Array.prototype.forEach.call(tbody.querySelectorAll("[data-remove]"), function(btn){
    btn.onclick=function(){
      var i=parseInt(btn.getAttribute("data-remove"),10);
      arr.splice(i,1);
      renderArrayTable(tbodyId, arr, cols, onChange);
      if(onChange) onChange();
    };
  });
}

/* ---- persistence ---- */
function saveCurrent(){
  var p=current;
  if(!p.name || !p.name.trim()){ toast("กรุณาระบุชื่อโครงการก่อนบันทึก"); return; }
  var now=new Date().toISOString();
  p.updatedAt=now;
  if(!p.createdAt) p.createdAt=now;
  p.isExample=false;

  if(db){
    var ref = p.id ? db.collection("proposals").doc(p.id) : db.collection("proposals").doc();
    if(!p.id) p.id=ref.id;
    var data=JSON.parse(JSON.stringify(p));
    ref.set(data).then(function(){
      toast("บันทึกโครงการเรียบร้อย");
      backFromDetail();
    }).catch(function(err){
      toast("บันทึกไม่สำเร็จ: "+(err&&err.message?err.message:"unknown"));
    });
  } else {
    if(!p.id) p.id=uid();
    var idx=proposals.findIndex(function(x){ return x.id===p.id; });
    if(idx>-1) proposals[idx]=p; else proposals.push(p);
    saveLocal(proposals);
    toast("บันทึกในเครื่องนี้แล้ว (โหมดออฟไลน์)");
    backFromDetail();
  }
}

function deleteCurrent(){
  var p=current;
  if(db){
    db.collection("proposals").doc(p.id).delete().then(function(){
      toast("ลบโครงการแล้ว");
      backFromDetail();
    }).catch(function(err){ toast("ลบไม่สำเร็จ: "+(err&&err.message?err.message:"unknown")); });
  } else {
    proposals=proposals.filter(function(x){ return x.id!==p.id; });
    saveLocal(proposals);
    toast("ลบโครงการแล้ว");
    backFromDetail();
  }
}

/* ---- boot ---- */
function attachListListeners(){
  document.getElementById("btn-new").onclick=function(){ goDetail(emptyProposal()); };
  document.getElementById("search-input").oninput=function(){ renderRegistry(); };
  document.getElementById("filter-status").onchange=function(){ renderRegistry(); };
  document.getElementById("filter-type").onchange=function(){ renderRegistry(); };
  document.getElementById("btn-download-template").onclick=function(){ downloadImportTemplate(); };
  document.getElementById("btn-import").onclick=function(){ document.getElementById("import-file-input").click(); };
  document.getElementById("import-file-input").onchange=function(e){
    var file = e.target.files && e.target.files[0];
    handleImportFile(file);
    e.target.value = "";
  };
  Array.prototype.forEach.call(document.querySelectorAll("#tabbar .tab"), function(btn){
    btn.onclick=function(){ switchTab(btn.getAttribute("data-tab")); };
  });
}

function boot(){
  attachListListeners();
  if(window.claude && window.claude.use){
    window.claude.use("db").then(function(d){
      if(d){
        db=d; dbReady=true;
        document.getElementById("offline-note").style.display="none";
        db.collection("proposals").onSnapshot(function(snap){
          proposals = snap.docs.map(function(doc){ return Object.assign({id:doc.id}, doc.data()); });
          if(proposals.length===0){
            var seed=exampleSeed();
            seed.forEach(function(p){ db.collection("proposals").doc(p.id).set(p); });
          } else {
            renderShell();
          }
        }, function(err){
          toast("การเชื่อมต่อฐานข้อมูลขัดข้อง: "+(err&&err.message?err.message:"unknown"));
        });
      } else {
        initOffline();
      }
    }).catch(function(){ initOffline(); });
    setTimeout(function(){ if(!dbReady && !proposals.length) initOffline(); }, 4500);
  } else {
    initOffline();
  }
}

function initOffline(){
  if(dbReady) return;
  document.getElementById("offline-note").style.display="";
  var local=loadLocal();
  proposals = local && local.length ? local : exampleSeed();
  if(!local) saveLocal(proposals);
  renderShell();
}

boot();
renderShell();
})();
</script>
